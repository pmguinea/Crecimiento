<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dosis y crecimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=swap" rel="stylesheet">
<style>
/* ===================== Material 3 · tokens ===================== */
:root{
  --primary:#00695E; --on-primary:#FFFFFF; --primary-container:#9EF2E4; --on-primary-container:#00201C;
  --secondary:#4A635E; --on-secondary:#FFFFFF; --secondary-container:#CCE8E2; --on-secondary-container:#06201B;
  --tertiary:#3F6375; --tertiary-container:#CBE6FF; --on-tertiary-container:#001E31;
  --error:#B3261E; --error-container:#F9DEDC; --on-error-container:#410E0B;
  --surface:#F5FBF8; --on-surface:#161D1B; --on-surface-variant:#3F4947;
  --outline:#6F7976; --outline-variant:#C3CEC9;
  --sc-lowest:#FFFFFF; --sc-low:#EFF6F2; --sc:#E9F1ED; --sc-high:#E3EAE7; --sc-highest:#DCE4E0;
  --inverse-surface:#2B3230; --inverse-on-surface:#ECF2EF;
  --scrim:rgba(0,0,0,.4);
  --r-xs:8px; --r-s:12px; --r-m:16px; --r-l:20px; --r-xl:28px; --r-f:999px;
  --e1:0 1px 2px rgba(0,0,0,.06), 0 1px 3px 1px rgba(0,0,0,.07);
  --e2:0 1px 2px rgba(0,0,0,.08), 0 2px 6px 2px rgba(0,0,0,.09);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#82D5C8; --on-primary:#00382F; --primary-container:#005046; --on-primary-container:#9EF2E4;
    --secondary:#B1CCC6; --on-secondary:#1C3531; --secondary-container:#334B47; --on-secondary-container:#CCE8E2;
    --tertiary:#A7CBE0; --tertiary-container:#26485C; --on-tertiary-container:#CBE6FF;
    --error:#F2B8B5; --error-container:#8C1D18; --on-error-container:#F9DEDC;
    --surface:#0E1514; --on-surface:#DDE4E1; --on-surface-variant:#BEC9C5;
    --outline:#899390; --outline-variant:#3F4947;
    --sc-lowest:#090F0E; --sc-low:#161D1B; --sc:#1A2220; --sc-high:#252B2A; --sc-highest:#303635;
    --inverse-surface:#DDE4E1; --inverse-on-surface:#2B3230;
    --scrim:rgba(0,0,0,.6);
    --e1:0 1px 2px rgba(0,0,0,.4); --e2:0 2px 8px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--surface); color:var(--on-surface);
  font-family:'Roboto Flex','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.43; letter-spacing:.0071em;
  padding-bottom:112px; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px 0}

/* ===================== tipografía ===================== */
h1{margin:0;font-size:1.75rem;font-weight:400;line-height:1.28;letter-spacing:0}
h2{margin:0;font-size:1rem;font-weight:500;line-height:1.5;letter-spacing:.009em}
h3{margin:0;font-size:.875rem;font-weight:600;letter-spacing:.006em}
p{margin:0}
.small{font-size:.8125rem;line-height:1.38;letter-spacing:.016em}
.tiny{font-size:.75rem;line-height:1.33;letter-spacing:.033em}
.muted{color:var(--on-surface-variant)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
input,select{font:inherit;color:inherit}
.mi{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;
    letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;
    direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';
    -webkit-font-smoothing:antialiased;font-variation-settings:'opsz' 24,'FILL' 0}

/* ===================== top app bar ===================== */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 0 10px}
header.top .sub{font-size:.6875rem;letter-spacing:.045em;color:var(--on-surface-variant);
  display:inline-flex;align-items:center;gap:5px;text-align:right}
header.top .sub .mi{font-size:15px}

/* ===================== cards ===================== */
.card{background:var(--sc-low);border-radius:var(--r-l);padding:16px}
.card + .card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sep{margin:22px 0 10px;padding-left:4px}
.rule{height:1px;background:var(--outline-variant);border:0;margin:14px 0;opacity:.7}

/* ===================== botones ===================== */
.btn{
  position:relative;border:0;background:var(--secondary-container);color:var(--on-secondary-container);
  border-radius:var(--r-f);min-height:40px;padding:0 20px;font-size:.875rem;font-weight:500;letter-spacing:.007em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;
  transition:box-shadow .15s, background-color .15s;
}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .12s}
.btn:hover::after{opacity:.08}
.btn:active::after{opacity:.12}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--e1)}
.btn.ghost{background:transparent;color:var(--primary);padding:0 12px}
.btn.small{min-height:32px;padding:0 16px;font-size:.8125rem}
.btn.wide{width:100%}
.btn.tall{min-height:50px;font-size:.9375rem}
.btn:disabled{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 38%,transparent);box-shadow:none;cursor:not-allowed}
.btn:disabled::after{display:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible,nav.tabs button:focus-visible,summary:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn::before{font-family:'Material Symbols Rounded';font-size:18px;font-weight:400;line-height:1;font-variation-settings:'opsz' 20,'FILL' 0}
[data-act="give"]::before{content:"medication"}
[data-act="undo"]::before{content:"undo"}
[data-act="endtr"]::before{content:"task_alt"}
[data-act="measure"]::before{content:"add"}
[data-act="newkid"]::before,[data-act="gokids"]::before{content:"person_add"}
[data-act="starttr"]::before{content:"push_pin"}
[data-act="calc"]::before{content:"arrow_forward"}
[data-act="editkid"]::before{content:"edit"}
[data-act="delkid"]::before{content:"delete"}
[data-act="savekid"]::before{content:"check"}
[data-act="cancelkid"]::before{content:"close"}
[data-act="export"]::before{content:"download"}
[data-act="delmeasure"]::before{content:"close";font-size:17px}
[data-act="pickcolor"]::before{content:none}

/* ===================== chips ===================== */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 14px;
  border-radius:var(--r-xs);border:1px solid var(--outline);background:transparent;color:var(--on-surface);
  font-size:.8125rem;font-weight:500;letter-spacing:.007em;transition:background-color .13s,border-color .13s;
}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--kc,var(--outline));flex:none}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
#kcolors .chip{padding:0 12px}
#kcolors .chip .dot{width:17px;height:17px}
#kcolors .chip[aria-pressed="true"]::before{font-family:'Material Symbols Rounded';content:"check";font-size:17px;margin-left:-3px}

/* ===================== segmented buttons ===================== */
.seg{display:flex;border:1px solid var(--outline);border-radius:var(--r-f);overflow:hidden}
.seg button{
  flex:1;border:0;border-left:1px solid var(--outline);background:transparent;color:var(--on-surface);
  min-height:40px;padding:0 6px;font-size:.8125rem;font-weight:500;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:background-color .13s;
}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.seg button[aria-pressed="true"]::before{font-family:'Material Symbols Rounded';content:"check";font-size:16px}
.seg.compact button{font-size:.75rem;padding:0 3px;gap:3px}
.seg.compact button[aria-pressed="true"]::before{font-size:14px}

/* ===================== cifra principal ===================== */
.dose{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px}
.dose .ml{font-size:4rem;line-height:1.05;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--primary)}
.dose .unit{font-size:1.5rem;font-weight:400;color:var(--on-surface-variant)}
.doseline{font-size:.8125rem;color:var(--on-surface-variant);letter-spacing:.016em}

/* ===================== pauta ===================== */
.treat{background:var(--sc-low);border-radius:var(--r-xl);padding:18px 16px}
.treat .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.treat .idwrap{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--kc);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:500;flex:none}
.treat .who{font-size:1rem;font-weight:500;line-height:1.3}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:var(--r-xs);
  font-size:.75rem;font-weight:500;background:var(--sc-high);color:var(--on-surface-variant);white-space:nowrap}
.pill .mi{font-size:15px}
.pill.ok{background:var(--primary-container);color:var(--on-primary-container)}
.pill.wait{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.pill.stopmax{background:var(--error-container);color:var(--on-error-container)}
.ticks{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tick{font-size:.75rem;padding:4px 10px;border-radius:var(--r-xs);background:var(--sc-high);
  color:var(--on-surface-variant);font-variant-numeric:tabular-nums}

/* ===================== avisos ===================== */
.note{border-radius:var(--r-s);padding:12px 14px;font-size:.8125rem;line-height:1.4;display:flex;gap:9px;align-items:flex-start}
.note::before{font-family:'Material Symbols Rounded';font-size:18px;line-height:1.2;flex:none}
.note.info{background:var(--sc-high);color:var(--on-surface-variant)}
.note.info::before{content:"info"}
.note.warn{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.note.warn::before{content:"warning"}
.note.stop{background:var(--error-container);color:var(--on-error-container)}
.note.stop::before{content:"emergency_home"}
.note .btn{margin-left:auto}

/* avatar global */
.avatar{border-radius:50%;background:var(--kc);color:#fff;display:inline-flex;align-items:center;
  justify-content:center;font-weight:500;flex:none;line-height:1}

/* ===================== quick boxes ===================== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.qbox{background:var(--sc-high);border-radius:var(--r-m);padding:10px 11px}
.qbox .qn{font-size:1.5rem;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--on-surface)}
.qbox .qu{font-size:.7rem;font-weight:400;color:var(--on-surface-variant)}

/* ===================== formularios ===================== */
label.f{display:block;font-size:.75rem;color:var(--on-surface-variant);margin-bottom:5px;letter-spacing:.033em}
input[type=text],input[type=number],input[type=date],select{
  width:100%;min-height:48px;padding:0 14px;border:1px solid var(--outline);border-radius:var(--r-xs);
  background:transparent;color:var(--on-surface);
}
input:focus,select:focus{border-color:var(--primary)}
select{appearance:none}

/* ===================== tabla ===================== */
table{width:100%;border-collapse:collapse;font-size:.8125rem}
th{text-align:left;font-weight:500;color:var(--on-surface-variant);font-size:.75rem;padding:0 0 8px;letter-spacing:.033em}
td{padding:10px 0;border-top:1px solid var(--outline-variant);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}

/* ===================== gráfica ===================== */
.chartbox{width:100%;overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}
.pctlabel{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pctchip{display:inline-flex;align-items:center;gap:6px;background:var(--sc-high);border-radius:var(--r-xs);
  padding:5px 11px;font-size:.75rem;color:var(--on-surface-variant)}
.pctchip b{color:var(--on-surface);font-weight:600;font-variant-numeric:tabular-nums}

/* ===================== navigation bar ===================== */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--sc);
  padding:12px 4px calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;
}
nav.tabs button{
  flex:1;border:0;background:transparent;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:.75rem;font-weight:500;letter-spacing:.033em;color:var(--on-surface-variant);
}
nav.tabs .ind{
  width:64px;height:32px;border-radius:var(--r-f);display:flex;align-items:center;justify-content:center;
  transition:background-color .18s cubic-bezier(.2,0,0,1);
}
nav.tabs .mi{font-size:24px}
nav.tabs button[aria-current="page"]{color:var(--on-surface)}
nav.tabs button[aria-current="page"] .ind{background:var(--secondary-container)}
nav.tabs button[aria-current="page"] .mi{font-variation-settings:'opsz' 24,'FILL' 1;color:var(--on-secondary-container)}
.view{display:none}
.view.on{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===================== pantalla de acceso ===================== */
body.locked .wrap, body.locked nav.tabs{display:none}
#gate{position:fixed;inset:0;z-index:70;background:var(--surface);display:none;
  align-items:center;justify-content:center;padding:24px}
body.locked #gate{display:flex}
#gate .gatecard{max-width:360px;width:100%;text-align:center}
#gate .mi.big{font-size:64px;color:var(--primary);margin-bottom:14px;display:block}
#gate h2{font-size:1.5rem;font-weight:400;margin-bottom:8px}
#gate p{margin-bottom:22px}
#gate .btn{width:100%}
#gatemsg{margin:16px 0 0;min-height:18px}
#gsignin::before{content:"login"}

/* ===================== varios ===================== */
.empty{text-align:center;padding:36px 16px;color:var(--on-surface-variant)}
.empty .mi{font-size:44px;color:var(--outline);margin-bottom:10px;display:block}
.empty h2{color:var(--on-surface);margin-bottom:6px;font-size:1.0625rem}
details.disc summary{cursor:pointer;font-size:.8125rem;color:var(--primary);font-weight:500;padding:8px 0;list-style:none}
details.disc summary::-webkit-details-marker{display:none}
details.disc summary::before{font-family:'Material Symbols Rounded';content:"expand_more";font-size:18px;vertical-align:-4px;margin-right:4px;display:inline-block;transition:transform .15s}
details.disc[open] summary::before{transform:rotate(180deg)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(8px);
  bottom:calc(116px + env(safe-area-inset-bottom,0px));
  background:var(--inverse-surface);color:var(--inverse-on-surface);
  padding:14px 18px;border-radius:var(--r-xs);font-size:.875rem;box-shadow:var(--e2);
  z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheetwrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--sc-low);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,0,0,1)}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--outline-variant);margin:0 auto 16px}
@keyframes up{from{transform:translateY(18px)}to{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<nav class="tabs" role="tablist">

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (v, d) => Number(v).toLocaleString('es-ES', {minimumFractionDigits: d, maximumFractionDigits: d});
const KCOLORS = ['#2F6FB8', '#B2457A', '#16876E', '#A4722A', '#6A5AC4', '#C2603A'];
const todayISO = () => {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
};

function ageMonths(birth, at) {
  if (!birth) return null;
  const b = new Date(birth + 'T00:00:00');
  const d = at ? new Date(at + 'T00:00:00') : new Date();
  let m = (d.getFullYear() - b.getFullYear()) * 12 + (d.getMonth() - b.getMonth());
  const anchor = new Date(b); anchor.setMonth(b.getMonth() + m);
  const next = new Date(b); next.setMonth(b.getMonth() + m + 1);
  const frac = (d - anchor) / (next - anchor);
  return Math.max(0, m + (isFinite(frac) ? frac : 0));
}

function ageText(birth) {
  const mo = ageMonths(birth);
  if (mo == null) return '';
  if (mo < 24) return Math.floor(mo) + ' meses';
  const y = Math.floor(mo / 12), r = Math.floor(mo % 12);
  return y + ' años' + (r ? ' y ' + r + (r === 1 ? ' mes' : ' meses') : '');
}

/* --- LMS: interpolación lineal entre meses enteros --- */
function lms(sex, key, months) {
  const t = WHO[sex] && WHO[sex][key];
  if (!t || months == null) return null;
  const last = t[t.length - 1][0];
  if (months < 0 || months > last) return null;
  const i = Math.min(Math.floor(months), last - 1);
  const a = t[i], b = t[i + 1] || a;
  if (!a) return null;
  const f = Math.min(1, Math.max(0, months - a[0]));
  return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3] + (b[3] - a[3]) * f];
}
const zOf = (L, M, S, x) => (Math.abs(L) < 1e-7 ? Math.log(x / M) / S : (Math.pow(x / M, L) - 1) / (L * S));
const valOf = (L, M, S, z) => (Math.abs(L) < 1e-7 ? M * Math.exp(S * z) : M * Math.pow(1 + L * S * z, 1 / L));

function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}
const pctOfZ = z => 100 * 0.5 * (1 + erf(z / Math.SQRT2));
function pctText(p) {
  if (p < 1) return '<P1';
  if (p > 99) return '>P99';
  return 'P' + (p < 10 ? p.toFixed(1).replace('.', ',') : Math.round(p));
}

const MEDS = {
  para: {
    name: 'Paracetamol', brands: 'Apiretal, Gelocatil, genéricos',
    concs: [{v: 100, label: '100 mg/ml'}, {v: 30, label: '30 mg/ml'}],
    intervals: [6, 8, 4], defInt: 6
  },
  ibu: {
    name: 'Ibuprofeno', brands: 'Dalsy, Junifen, genéricos',
    concs: [{v: 20, label: '20 mg/ml · 2%'}, {v: 40, label: '40 mg/ml · 4%'}],
    intervals: [8, 6], defInt: 8
  }
};

function calcDose(weight, med, conc, interval) {
  if (!weight || weight <= 0) return null;
  let mgkg, maxDay, minKg, maxKg, capMg;
  if (med === 'para') {
    mgkg = interval <= 4 ? 10 : 15;
    minKg = 10; maxKg = 15; maxDay = 60; capMg = 1000;
  } else {
    mgkg = 20 / 3;           // regla AEPap: peso/3 ml de 20 mg/ml
    minKg = 5; maxKg = 10; maxDay = 30; capMg = 400;
  }
  let mg = weight * mgkg;
  const capped = mg > capMg;
  if (capped) mg = capMg;
  const ml = mg / conc;
  const maxMgDay = Math.min(weight * maxDay, med === 'para' ? 4000 : 1200);
  const perInterval = Math.floor(24 / interval);
  const maxDoses = Math.max(1, Math.min(perInterval, Math.floor(maxMgDay / mg)));
  return {
    mg, ml, mgkg: mg / weight, capped,
    minMl: (weight * minKg) / conc, maxMl: Math.min(weight * maxKg, capMg) / conc,
    maxMgDay, maxDoses, interval,
    label: MEDS[med].name + ' ' + conc + ' mg/ml'
  };
}

function medWarnings(kid, med, weight) {
  const out = [];
  const mo = ageMonths(kid.birth);
  if (med === 'ibu') {
    if (mo != null && mo < 3) out.push(['stop', 'El ibuprofeno no se usa en menores de 3 meses. Consulta con el pediatra.']);
    else if (weight && weight < 5) out.push(['warn', 'Por debajo de 5 kg el ibuprofeno necesita indicación del pediatra.']);
    out.push(['info', 'Mejor con algo de comida. Evítalo si hay vómitos, diarrea importante o poca ingesta de líquidos (deshidratación).']);
  }
  if (mo != null && mo < 3) out.push(['stop', 'Fiebre en un bebé de menos de 3 meses: hay que verlo un médico, no automedicar.']);
  return out;
}

/* ============================ almacenamiento ============================ */
const Store = {
  mode: 'local', fs: null, auth: null, user: null, canWrite: true,
  kids: [], treatments: [], ready: false, _subs: [],

  configured() {
    return !!(window.firebase && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PEGA_AQUI') !== 0);
  },

  async init() {
    if (!this.configured()) {       // sin configurar: modo local, para poder probar
      gateMsg('Falta configurar Firebase en la cabecera del archivo. De momento los datos se guardan solo en este dispositivo.');
      this.loadLocal(); this.ready = true; unlock(true); render();
      return;
    }
    this.mode = 'fb';
    firebase.initializeApp(FIREBASE_CONFIG);
    this.auth = firebase.auth();
    this.fs = firebase.firestore();
    try { await this.fs.enablePersistence({synchronizeTabs: true}); } catch (e) {}

    this.auth.onAuthStateChanged(u => {
      this.detach();
      if (!u) { this.user = null; unlock(false); gateMsg(''); return; }
      const mail = (u.email || '').toLowerCase();
      if (CORREOS_PERMITIDOS.length && CORREOS_PERMITIDOS.indexOf(mail) < 0) {
        gateMsg('La cuenta ' + mail + ' no tiene acceso a esta aplicación.');
        this.auth.signOut();
        return;
      }
      this.user = u; unlock(true); this.attach();
    });
  },

  attach() {
    const bind = (name, prop) => this.fs.collection(name).onSnapshot(
      snap => { this[prop] = snap.docs.map(d => Object.assign({id: d.id}, d.data())); this.ready = true; render(); },
      err => { this.ready = true; if (err && err.code === 'permission-denied') toast('Sin permiso: revisa las reglas de Firestore'); render(); }
    );
    this._subs = [bind('kids', 'kids'), bind('treatments', 'treatments')];
  },
  detach() { this._subs.forEach(u => { try { u(); } catch (e) {} }); this._subs = []; this.kids = []; this.treatments = []; },

  loadLocal() {
    try {
      this.kids = JSON.parse(localStorage.getItem('dc.kids') || '[]');
      this.treatments = JSON.parse(localStorage.getItem('dc.tr') || '[]');
    } catch (e) {}
  },
  _local() {
    try {
      localStorage.setItem('dc.kids', JSON.stringify(this.kids));
      localStorage.setItem('dc.tr', JSON.stringify(this.treatments));
    } catch (e) {}
  },

  async save(coll, obj) {
    const arr = coll === 'kids' ? this.kids : this.treatments;
    const i = arr.findIndex(x => x.id === obj.id);
    if (i >= 0) arr[i] = obj; else arr.push(obj);
    if (this.mode === 'fb') {
      const body = Object.assign({}, obj); delete body.id;
      try { await this.fs.collection(coll).doc(obj.id).set(body); }
      catch (e) { toast('No se pudo guardar: ' + (e.code || e.message)); render(); return false; }
    } else { this._local(); }
    render(); return true;
  },
  async remove(coll, id) {
    const arr = coll === 'kids' ? this.kids : this.treatments;
    const i = arr.findIndex(x => x.id === id);
    if (i >= 0) arr.splice(i, 1);
    if (this.mode === 'fb') { try { await this.fs.collection(coll).doc(id).delete(); } catch (e) { toast('No se pudo borrar'); } }
    else this._local();
    render();
  },
  async signOut() { if (this.auth) await this.auth.signOut(); }
};

function unlock(ok) { document.body.classList.toggle('locked', !ok); if (ok) render(); }
function gateMsg(t) { const el = document.getElementById('gatemsg'); if (el) el.textContent = t; }

document.addEventListener('DOMContentLoaded', () => {
  const b = document.getElementById('gsignin');
  if (!b) return;
  b.onclick = async () => {
    if (!Store.configured()) { gateMsg('Todavía no has pegado los datos de Firebase.'); return; }
    gateMsg('');
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({prompt: 'select_account'});
    try { await Store.auth.signInWithPopup(prov); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
        try { await Store.auth.signInWithRedirect(prov); return; } catch (e2) {}
      }
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        gateMsg('No se pudo entrar (' + e.code + ').');
      }
    }
  };
});

const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ============================ estado de la vista ============================ */
const UI = {
  tab: 'home',
  doseKid: null, doseMed: 'para', doseConc: 100, doseInt: 6,
  growthKid: null, growthMetric: 'w',
  editKid: null, showKidForm: false
};

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200);
}

const kidById = id => Store.kids.find(k => k.id === id);
const initial = n => (n || '?').trim().charAt(0).toUpperCase();
const avatar = (k, size) => '<span class="avatar" style="--kc:' + (k.color || KCOLORS[0]) +
  (size ? ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * .42) + 'px' : '') + '">' + esc(initial(k.name)) + '</span>';
function sortedKids() { return Store.kids.slice().sort((a, b) => (a.birth || '') < (b.birth || '') ? -1 : 1); }
function lastMeasure(kid) {
  const ms = (kid.measures || []).filter(m => m.w).sort((a, b) => a.d < b.d ? -1 : 1);
  return ms[ms.length - 1] || null;
}
function kidWeight(kid) { const m = lastMeasure(kid); return m ? m.w : null; }

/* --------- tiempo --------- */
function durText(ms) {
  const mins = Math.round(Math.abs(ms) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return m + ' min';
  if (m === 0) return h + ' h';
  return h + ' h ' + m + ' min';
}
const hhmm = iso => new Date(iso).toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
function dosesIn24h(t) {
  const cut = Date.now() - 24 * 3600 * 1000;
  return (t.doses || []).filter(d => new Date(d).getTime() > cut).sort();
}

/* ============================ render ============================ */
function render() {
  $('#viewTitle').textContent = {home: 'Hoy', dose: 'Calcular dosis', growth: 'Crecimiento', kids: 'Hijos'}[UI.tab];

    ? ['cloud_done', (Store.user && Store.user.displayName ? Store.user.displayName.split(' ')[0] : 'Sincronizado')]

/* ---------------- Hoy ---------------- */
function renderHome() {
  const el = $('#v-home');
  if (!Store.kids.length) { el.innerHTML = noKidsHTML('Después podrás calcular dosis en un toque.'); return; }

function quickBox(name, conc, ml) {
  return '<div class="qbox"><div class="tiny muted">' + name + '</div>' +
    '<div class="tiny muted" style="margin-bottom:3px">' + conc + '</div>' +
    '<div class="qn">' + mlText(ml) + '<span class="qu"> ml</span></div></div>';
}
const mlText = ml => nf(Math.round(ml * 20) / 20, 2).replace(',00', '').replace(/,(\d)0$/, ',$1');

function treatCard(t) {
  const k = kidById(t.kidId);
  if (!k) return '';
  const c = k.color || KCOLORS[0];
  const w = kidWeight(k);
  const d = w ? calcDose(w, t.med, t.conc, t.interval) : null;
  const log = dosesIn24h(t);
  const last = log[log.length - 1];
  const nextAt = last ? new Date(last).getTime() + t.interval * 3600 * 1000 : null;
  const now = Date.now();
  const due = !nextAt || now >= nextAt;
  const overMax = d && log.length >= d.maxDoses;

  let h = '<div class="treat" style="--kc:' + c + '">';
  const pillCls = overMax ? 'stopmax' : (due ? 'ok' : 'wait');
  const pillIcon = overMax ? 'block' : (due ? 'notifications_active' : 'schedule');
  const pillTxt = overMax ? 'Tope diario' : (due ? 'Toca ahora' : 'En ' + durText(nextAt - now));
  h += '<div class="head"><div class="idwrap">' + avatar(k, 40) + '<div><div class="who">' + esc(k.name) + '</div>' +
    '<div class="small muted">' + MEDS[t.med].name + ' ' + t.conc + ' mg/ml · cada ' + t.interval + ' h</div></div></div>' +
    '<span class="pill ' + pillCls + '"><span class="mi">' + pillIcon + '</span>' + pillTxt + '</span></div>';

  if (d) {
    h += '<div class="dose"><span class="ml">' + mlText(d.ml) + '</span><span class="unit">ml</span></div>' +
      '<div class="doseline">' + nf(d.mg, 0) + ' mg · ' + nf(d.mgkg, 1) + ' mg/kg · peso ' + nf(w, 1) + ' kg</div>';
  } else {
    h += '<div class="note warn" style="margin:10px 0">Apunta el peso de ' + esc(k.name) + ' para poder calcular la dosis.</div>';
  }

  if (t.note) h += '<div class="small muted" style="margin-top:8px">' + esc(t.note) + '</div>';

  h += '<div class="ticks">';
  if (!log.length) h += '<span class="tick">Sin tomas en 24 h</span>';
  else log.forEach((x, i) => { h += '<span class="tick">' + hhmm(x) + (i === log.length - 1 ? ' · hace ' + durText(now - new Date(x).getTime()) : '') + '</span>'; });
  if (d) h += '<span class="tick">' + log.length + '/' + d.maxDoses + ' tomas</span>';
  h += '</div>';

  if (overMax) h += '<div class="note warn" style="margin-top:10px">Ya se ha llegado al máximo de tomas en 24 h. No des más sin hablar con el pediatra.</div>';
  else if (!due && nextAt) h += '<div class="note info" style="margin-top:10px">Siguiente a las ' + hhmm(new Date(nextAt).toISOString()) + '.</div>';

  h += '<div class="btnrow" style="margin-top:14px">' +
    '<button class="btn primary tall" style="flex:1 1 100%" data-act="give" data-tr="' + t.id + '"' + (!d ? ' disabled' : '') + '>Dar dosis ahora</button>' +
    (log.length ? '<button class="btn ghost" data-act="undo" data-tr="' + t.id + '">Deshacer</button>' : '') +
    '<button class="btn ghost" data-act="endtr" data-tr="' + t.id + '">Terminar</button></div>';
  h += '</div>';
  return h;
}

function weightTable(med, conc, interval, hl) {
  let h = '<table><thead><tr><th>Peso</th><th class="r">ml por toma</th><th class="r">mg</th></tr></thead><tbody>';

  }
  return h + '</tbody></table>';
}

const fechaCorta = iso => new Date(iso + 'T00:00:00').toLocaleDateString('es-ES', {day: 'numeric', month: 'short', year: '2-digit'});

function currentPercentiles(k) {
  const m = (k.measures || []).slice().sort((a, b) => a.d < b.d ? -1 : 1).pop();
  if (!m) return '';
  const mo = ageMonths(k.birth, m.d);
  const parts = [];
  Object.keys(METRICS).forEach(key => {
    const val = METRICS[key].of(m);
    if (!val) return;
    const p = lms(k.sex, METRICS[key].key, mo);
    if (!p) return;
    parts.push('<span class="pctchip">' + METRICS[key].label + ' <b>' + pctText(pctOfZ(zOf(p[0], p[1], p[2], val))) + '</b></span>');
  });
  if (!parts.length) return '';
  return '<div class="pctlabel">' + parts.join('') + '<span class="pctchip">' + fechaCorta(m.d) + '</span></div>';
}

function chartBlock(k, metric) {
  const M = METRICS[metric];
  const pts = (k.measures || []).map(m => ({mo: ageMonths(k.birth, m.d), v: M.of(m), d: m.d}))
    .filter(p => p.v && p.mo != null).sort((a, b) => a.mo - b.mo);
  const table = WHO[k.sex] && WHO[k.sex][M.key];
  if (!table) return '<div class="note info">Faltan datos de referencia.</div>';
  const maxMo = table[table.length - 1][0];
  if (!pts.length) {
    return '<div class="empty"><span class="mi">show_chart</span><p class="small">Aún no hay medidas de ' + M.label.toLowerCase() + '.</p>' +
      '<p style="margin-top:14px"><button class="btn" data-act="measure" data-kid="' + k.id + '">Añadir medida</button></p></div>';
  }
  const ageNow = Math.min(ageMonths(k.birth), maxMo);
  const first = pts[0].mo, lastp = pts[pts.length - 1].mo;
  let xMin = Math.max(0, Math.floor(first - 2));
  let xMax = Math.min(maxMo, Math.ceil(Math.max(lastp, ageNow) + 4));
  if (xMax - xMin < 12) { xMax = Math.min(maxMo, xMin + 12); xMin = Math.max(0, xMax - 12); }

  let svg = drawChart(k, metric, pts.filter(p => p.mo <= maxMo), xMin, xMax);
  let note = currentPercentiles(k);
  if (metric === 'w' && ageMonths(k.birth) > maxMo) {
    note += '<div class="note info" style="margin-top:8px">La OMS no publica percentil de peso por edad a partir de los 10 años: a esa edad se mira el IMC.</div>';
  }
  return '<div class="chartbox">' + svg + '</div>' + note;
}

function drawChart(k, metric, pts, xMin, xMax) {
  const M = METRICS[metric], key = M.key, sex = k.sex;
  const W = 540, H = 330, pl = 38, pr = 26, pt = 12, pb = 28;
  const iw = W - pl - pr, ih = H - pt - pb;
  const ZS = [[1.881, '97'], [1.036, '85'], [0, '50'], [-1.036, '15'], [-1.881, '3']];
  const step = Math.max(0.5, (xMax - xMin) / 90);

  let yMin = Infinity, yMax = -Infinity;
  const curves = ZS.map(([z]) => {
    const pathPts = [];
    for (let m = xMin; m <= xMax + 0.001; m += step) {
      const p = lms(sex, key, Math.min(m, xMax));
      if (!p) continue;
      const v = valOf(p[0], p[1], p[2], z);
      pathPts.push([m, v]);
      if (v < yMin) yMin = v; if (v > yMax) yMax = v;
    }
    return pathPts;
  });
  pts.forEach(p => { if (p.v < yMin) yMin = p.v; if (p.v > yMax) yMax = p.v; });
  const pad = (yMax - yMin) * 0.07 || 1;
  yMin -= pad; yMax += pad;

  const X = m => pl + ((m - xMin) / (xMax - xMin)) * iw;
  const Y = v => pt + (1 - (v - yMin) / (yMax - yMin)) * ih;
  const d = arr => arr.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');

  const color = k.color || KCOLORS[0];
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Percentiles de ' + esc(M.label) + ' de ' + esc(k.name) + '">';

  // ticks Y
  const yt = niceTicks(yMin, yMax, 5);
  yt.forEach(v => {
    s += '<line x1="' + pl + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - pr) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--outline-variant)" stroke-width="1"/>';
    s += '<text x="' + (pl - 7) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="var(--on-surface-variant)">' + nf(v, v % 1 ? 1 : 0) + '</text>';
  });
  // ticks X
  const spanY = (xMax - xMin) / 12;
  const inYears = spanY > 2;
  const xt = niceTicks(inYears ? xMin / 12 : xMin, inYears ? xMax / 12 : xMax, 5);
  xt.forEach(v => {
    const mo = inYears ? v * 12 : v;
    if (mo < xMin - 0.01 || mo > xMax + 0.01) return;
    s += '<line x1="' + X(mo).toFixed(1) + '" y1="' + pt + '" x2="' + X(mo).toFixed(1) + '" y2="' + (pt + ih) + '" stroke="var(--outline-variant)" stroke-width="1" opacity=".5"/>';
    s += '<text x="' + X(mo).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="10.5" fill="var(--on-surface-variant)">' + nf(v, v % 1 ? 1 : 0) + (inYears ? ' a' : ' m') + '</text>';
  });

  // curvas
  curves.forEach((c, i) => {
    const isMed = ZS[i][0] === 0;
    s += '<path d="' + d(c) + '" fill="none" stroke="var(--on-surface-variant)" stroke-width="' + (isMed ? 1.6 : 1) + '" opacity="' + (isMed ? .6 : .32) + '"' + (isMed ? '' : ' stroke-dasharray="3 3"') + '/>';
    const lastp = c[c.length - 1];
    if (lastp) s += '<text x="' + (W - pr + 3) + '" y="' + (Y(lastp[1]) + 3.5).toFixed(1) + '" font-size="9.5" fill="var(--on-surface-variant)">' + ZS[i][1] + '</text>';
  });

  // línea del niño
  if (pts.length > 1) s += '<path d="' + d(pts.map(p => [p.mo, p.v])) + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(p => {
    s += '<circle cx="' + X(p.mo).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="4" fill="' + color + '" stroke="var(--sc-low)" stroke-width="2"><title>' + fechaCorta(p.d) + ': ' + nf(p.v, 1) + ' ' + M.unit + '</title></circle>';
  });
  const lp = pts[pts.length - 1];
  if (lp) {
    const anchor = X(lp.mo) > W * .7 ? 'end' : 'start';
    const dx = anchor === 'end' ? -8 : 8;
    s += '<text x="' + (X(lp.mo) + dx).toFixed(1) + '" y="' + (Y(lp.v) - 9).toFixed(1) + '" text-anchor="' + anchor + '" font-size="12.5" font-weight="600" fill="' + color + '">' + nf(lp.v, 1) + (M.unit ? ' ' + M.unit : '') + '</text>';
  }
  s += '</svg>';
  return s;
}

function niceTicks(min, max, n) {
  const span = max - min;
  if (!(span > 0)) return [min];
  const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const stepN = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  const st = stepN * mag;
  const out = [];
  for (let v = Math.ceil(min / st) * st; v <= max + 1e-9; v += st) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}

function measureTable(k) {
  const ms = (k.measures || []).slice().sort((a, b) => a.d < b.d ? -1 : 1).reverse();
  if (!ms.length) return '<p class="small muted">Sin medidas todavía.</p>';
  let h = '<table><thead><tr><th>Fecha</th><th>Edad</th><th class="r">Peso</th><th class="r">Talla</th><th class="r"></th></tr></thead><tbody>';
  ms.forEach((m, i) => {
    h += '<tr><td>' + fechaCorta(m.d) + '</td><td class="muted">' + mesesCortos(ageMonths(k.birth, m.d)) + '</td>' +
      '<td class="r">' + (m.w ? nf(m.w, 1) + ' kg' : '—') + '</td><td class="r">' + (m.h ? nf(m.h, 1) + ' cm' : '—') + '</td>' +
      '<td class="r"><button class="btn small ghost" data-act="delmeasure" data-kid="' + k.id + '" data-d="' + m.d + '" aria-label="Borrar">×</button></td></tr>';
  });
  return h + '</tbody></table>';
}
function mesesCortos(mo) {
  if (mo == null) return '';
  if (mo < 24) return Math.floor(mo) + ' m';
  return Math.floor(mo / 12) + 'a ' + Math.floor(mo % 12) + 'm';
}

    h += '<div class="treat" style="--kc:' + c + ';padding:16px">' +
      '<div class="row"><div class="idwrap">' + avatar(k, 44) + '<div><div class="who">' + esc(k.name) + '</div>' +
      '<div class="tiny muted">' + (k.sex === 'm' ? 'Niño' : 'Niña') + ' · ' + ageText(k.birth) + '<br>' +
      (w ? 'Último peso ' + nf(w, 1) + ' kg' : 'Sin peso apuntado') + '</div></div></div>' +
      '<button class="btn small ghost" data-act="editkid" data-kid="' + k.id + '">Editar</button></div>' +
      '<div class="btnrow" style="margin-top:12px"><button class="btn small" data-act="measure" data-kid="' + k.id + '">Añadir medida</button></div>' +
      '</div>';
  });
  h += '</div>';

  h += '<h2 class="sep">Copia de los datos</h2><div class="card">' +
    '<p class="small muted">Descarga todo en una hoja de cálculo: las medidas con sus percentiles y el registro de tomas.</p>' +
    '<div class="btnrow" style="margin-top:12px"><button class="btn wide" data-act="export">Exportar a Excel</button></div></div>';

    (Store.mode === 'fb' && Store.user
      ? '<p class="small muted">Has entrado como <b>' + esc(Store.user.email || '') + '</b>. Los datos se sincronizan al instante con las demás cuentas autorizadas.</p>' +
        '<div class="btnrow" style="margin-top:12px"><button class="btn wide" data-act="signout">Cerrar sesión</button></div>'

    '<label class="f" for="kn">Nombre</label><input id="kn" type="text" value="' + esc(k ? k.name : '') + '" placeholder="Nombre">' +
    '<div class="grid2" style="margin-top:10px">' +
    '<div><label class="f" for="kb">Fecha de nacimiento</label><input id="kb" type="date" value="' + (k ? k.birth : '') + '" max="' + todayISO() + '"></div>' +
    '<div><label class="f" for="ks">Sexo</label><select id="ks"><option value="m"' + (k && k.sex === 'm' ? ' selected' : '') + '>Niño</option><option value="f"' + (k && k.sex === 'f' ? ' selected' : '') + '>Niña</option></select></div></div>' +
    '<label class="f" style="margin-top:10px">Color</label><div class="chips" id="kcolors">';

function disclaimerHTML() {

    'Los percentiles usan los patrones de la OMS (0–5 años) y la referencia OMS 2007 (5–19 años).</p>' +
    '<p style="margin-top:8px">Esto es una ayuda de cálculo para casa, no sustituye al pediatra. Comprueba siempre la concentración en el envase: no todos los jarabes son iguales. ' +
    'Ante fiebre en menores de 3 meses, fiebre de más de 3 días, mal estado general, manchas en la piel, dificultad para respirar o rechazo del líquido, consulta.</p></div></details>';
}


/* --- diálogos propios (los nativos no funcionan dentro del visor) --- */
function sheet(innerHTML) {
  const dlg = document.createElement('div');
  dlg.className = 'sheetwrap';
  dlg.innerHTML = '<div class="sheet"><div class="handle"></div>' + innerHTML + '</div>';
  document.body.appendChild(dlg);
  return dlg;
}
function askText(title, label, initial, okLabel) {
  return new Promise(res => {
    const dlg = sheet('<h3 style="margin-bottom:10px">' + esc(title) + '</h3>' +
      '<label class="f" for="axt">' + esc(label) + '</label><input id="axt" type="text" value="' + esc(initial || '') + '">' +
      '<div class="btnrow" style="margin-top:18px"><button class="btn ghost" id="ano">Cancelar</button><button class="btn primary tall" id="aok">' + esc(okLabel || 'Guardar') + '</button></div>');
    const done = v => { dlg.remove(); res(v); };
    dlg.addEventListener('click', ev => { if (ev.target === dlg) done(null); });
    $('#ano', dlg).onclick = () => done(null);
    $('#aok', dlg).onclick = () => done($('#axt', dlg).value.trim());
    $('#axt', dlg).onkeydown = ev => { if (ev.key === 'Enter') done($('#axt', dlg).value.trim()); };
    setTimeout(() => $('#axt', dlg).focus(), 60);
  });
}
function askConfirm(title, msg, okLabel, danger) {
  return new Promise(res => {
    const dlg = sheet('<h3 style="margin-bottom:6px">' + esc(title) + '</h3><p class="small muted">' + esc(msg) + '</p>' +
      '<div class="btnrow" style="margin-top:18px"><button class="btn ghost" id="cno">Cancelar</button>' +
      '<button class="btn tall ' + (danger ? '' : 'primary') + '" id="cok"' + (danger ? ' style="background:var(--error-container);color:var(--on-error-container)"' : '') + '>' + esc(okLabel) + '</button></div>');
    const done = v => { dlg.remove(); res(v); };
    dlg.addEventListener('click', ev => { if (ev.target === dlg) done(false); });
    $('#cno', dlg).onclick = () => done(false);
    $('#cok', dlg).onclick = () => done(true);
  });
}

/* ============================ interacciones ============================ */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act], nav.tabs button');
  if (!b) return;
  if (b.dataset.tab) { UI.tab = b.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const a = b.dataset.act;

  if (a === 'gokids') { UI.tab = 'kids'; UI.showKidForm = true; UI.editKid = null; render(); return; }
  if (a === 'newkid') { UI.showKidForm = true; UI.editKid = null; render(); return; }
  if (a === 'editkid') { UI.showKidForm = true; UI.editKid = b.dataset.kid; render(); return; }
  if (a === 'cancelkid') { UI.showKidForm = false; UI.editKid = null; render(); return; }
  if (a === 'pickcolor') {
    document.querySelectorAll('#kcolors .chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    return;
  }
  if (a === 'savekid') {
    const name = $('#kn').value.trim(), birth = $('#kb').value, sex = $('#ks').value;
    const col = ($('#kcolors .chip[aria-pressed="true"]') || {}).dataset;
    if (!name) { toast('Falta el nombre'); return; }
    if (!birth) { toast('Falta la fecha de nacimiento'); return; }
    const old = UI.editKid ? kidById(UI.editKid) : null;
    const kid = {
      id: old ? old.id : newId('k'), name, birth, sex,
      color: col ? col.color : KCOLORS[0], measures: old ? (old.measures || []) : []
    };
    UI.showKidForm = false; UI.editKid = null;
    await Store.save('kids', kid);
    return;
  }
  if (a === 'delkid') {
    if (await askConfirm('Borrar a ' + esc((kidById(b.dataset.kid) || {}).name || ''), 'Se borran también sus medidas y sus pautas. No se puede deshacer.', 'Borrar', true)) {
      Store.treatments.filter(t => t.kidId === b.dataset.kid).forEach(t => Store.remove('treatments', t.id));
      UI.showKidForm = false; UI.editKid = null;
      await Store.remove('kids', b.dataset.kid);
    }
    return;
  }
  if (a === 'signout') { if (await askConfirm('Cerrar sesión', 'Tendrás que volver a entrar con Google.', 'Cerrar sesión')) Store.signOut(); return; }
  if (a === 'export') { exportExcel(); return; }
  if (a === 'measure') { openMeasure(b.dataset.kid); return; }
  if (a === 'delmeasure') {
    const k = kidById(b.dataset.kid);
    if (!k) return;
    k.measures = (k.measures || []).filter(m => m.d !== b.dataset.d);
    await Store.save('kids', k);
    return;
  }
  if (a === 'setkid') { UI.doseKid = b.dataset.kid; render(); return; }
  if (a === 'setgkid') { UI.growthKid = b.dataset.kid; render(); return; }
  if (a === 'setmed') { UI.doseMed = b.dataset.med; UI.doseConc = MEDS[UI.doseMed].concs[0].v; UI.doseInt = MEDS[UI.doseMed].defInt; render(); return; }
  if (a === 'setconc') { UI.doseConc = +b.dataset.conc; render(); return; }
  if (a === 'setint') { UI.doseInt = +b.dataset.int; render(); return; }
  if (a === 'setmetric') { UI.growthMetric = b.dataset.metric; render(); return; }
  if (a === 'calc') { UI.doseKid = b.dataset.kid; UI.tab = 'dose'; window.scrollTo(0, 0); render(); return; }

  if (a === 'starttr') {
    const k = kidById(UI.doseKid);
    const existing = Store.treatments.find(t => t.active !== false && t.kidId === k.id && t.med === UI.doseMed);
    const note = await askText('Pauta de ' + k.name, '¿Para qué es? (otitis, fiebre, después de la vacuna…)', existing ? existing.note : '', 'Guardar pauta');
    if (note === null) return;
    const tr = {
      id: existing ? existing.id : newId('t'),
      kidId: k.id, med: UI.doseMed, conc: UI.doseConc, interval: UI.doseInt,
      note: note.trim(), active: true, startedAt: new Date().toISOString(),
      doses: existing ? (existing.doses || []) : []
    };
    await Store.save('treatments', tr);
    UI.tab = 'home'; window.scrollTo(0, 0); render();
    toast('Pauta guardada en Hoy');
    return;
  }
  if (a === 'give') {
    const t = Store.treatments.find(x => x.id === b.dataset.tr);
    if (!t) return;
    t.doses = (t.doses || []).concat([new Date().toISOString()]).slice(-40);
    await Store.save('treatments', t);
    toast('Toma registrada');
    return;
  }
  if (a === 'undo') {
    const t = Store.treatments.find(x => x.id === b.dataset.tr);
    if (!t || !(t.doses || []).length) return;
    t.doses = t.doses.slice(0, -1);
    await Store.save('treatments', t);
    toast('Última toma borrada');
    return;
  }
  if (a === 'endtr') {
    if (!(await askConfirm('Terminar la pauta', 'Dejará de aparecer en Hoy y se borra el registro de tomas.', 'Terminar', true))) return;
    await Store.remove('treatments', b.dataset.tr);
    return;
  }
});

/* --- diálogo de medida --- */
function openMeasure(kidId) {
  const k = kidById(kidId); if (!k) return;
  const dlg = sheet('<h3 style="margin-bottom:12px">Medida de ' + esc(k.name) + '</h3>' +
    '<label class="f" for="md">Fecha</label><input id="md" type="date" value="' + todayISO() + '" max="' + todayISO() + '">' +
    '<div class="grid2" style="margin-top:10px">' +
    '<div><label class="f" for="mw">Peso (kg)</label><input id="mw" type="number" inputmode="decimal" step="0.1" min="1" max="120" placeholder="14,2"></div>' +
    '<div><label class="f" for="mh">Talla (cm)</label><input id="mh" type="number" inputmode="decimal" step="0.5" min="30" max="210" placeholder="96"></div></div>' +
    '<div class="btnrow" style="margin-top:18px"><button class="btn ghost" id="mcancel">Cancelar</button><button class="btn primary tall" id="msave">Guardar</button></div>');
  const close = () => dlg.remove();
  dlg.addEventListener('click', ev => { if (ev.target === dlg) close(); });
  $('#mcancel', dlg).onclick = close;
  setTimeout(() => $('#mw', dlg).focus(), 60);
  $('#msave', dlg).onclick = async () => {
    const d = $('#md', dlg).value;
    const w = parseFloat(String($('#mw', dlg).value).replace(',', '.'));
    const hh = parseFloat(String($('#mh', dlg).value).replace(',', '.'));
    if (!d) { toast('Falta la fecha'); return; }
    if (!w && !hh) { toast('Pon al menos el peso o la talla'); return; }
    const kid = kidById(kidId);
    const list = (kid.measures || []).filter(m => m.d !== d);
    const prev = (kid.measures || []).find(m => m.d === d) || {};
    const row = {d};
    if (w) row.w = Math.round(w * 10) / 10; else if (prev.w) row.w = prev.w;
    if (hh) row.h = Math.round(hh * 10) / 10; else if (prev.h) row.h = prev.h;
    kid.measures = list.concat([row]).sort((a, b) => a.d < b.d ? -1 : 1).slice(-200);
    close();
    await Store.save('kids', kid);
    toast('Medida guardada');
  };
}


/* ============================ exportar a Excel ============================ */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error('no XLSX')));
    sc.onerror = () => rej(new Error('no se pudo cargar'));
    document.head.appendChild(sc);
  });
}
const ddmmyyyy = iso => {
  const d = new Date(iso.length > 10 ? iso : iso + 'T00:00:00');
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
};
const r1 = v => (v == null ? '' : Math.round(v * 10) / 10);

function buildSheets() {
  const hijos = [['Nombre', 'Sexo', 'Fecha de nacimiento', 'Edad hoy']];
  const medidas = [['Hijo', 'Fecha', 'Edad (meses)', 'Edad', 'Peso (kg)', 'Talla (cm)', 'IMC',
                    'Percentil peso', 'Percentil talla', 'Percentil IMC']];
  const tomas = [['Hijo', 'Medicamento', 'Concentración (mg/ml)', 'Fecha', 'Hora',
                  'Dosis (ml)', 'Dosis (mg)', 'Motivo']];

  sortedKids().forEach(k => {
    hijos.push([k.name, k.sex === 'm' ? 'Niño' : 'Niña', ddmmyyyy(k.birth), ageText(k.birth)]);
    (k.measures || []).slice().sort((a, b) => a.d < b.d ? -1 : 1).forEach(m => {
      const mo = ageMonths(k.birth, m.d);
      const bmi = (m.w && m.h) ? m.w / Math.pow(m.h / 100, 2) : null;
      const pct = (key, val) => {
        if (!val) return '';
        const p = lms(k.sex, key, mo);
        return p ? Math.round(pctOfZ(zOf(p[0], p[1], p[2], val)) * 10) / 10 : '';
      };
      medidas.push([k.name, ddmmyyyy(m.d), Math.round(mo * 10) / 10, mesesCortos(mo),
        m.w || '', m.h || '', bmi ? Math.round(bmi * 10) / 10 : '',
        pct('wfa', m.w), pct('hfa', m.h), pct('bmi', bmi)]);
    });
  });

  Store.treatments.forEach(t => {
    const k = kidById(t.kidId); if (!k) return;
    const w = kidWeight(k);
    const d = w ? calcDose(w, t.med, t.conc, t.interval) : null;
    (t.doses || []).slice().sort().forEach(iso => {
      const dt = new Date(iso);
      tomas.push([k.name, MEDS[t.med].name, t.conc, ddmmyyyy(iso),
        dt.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'}),
        d ? Math.round(d.ml * 100) / 100 : '', d ? Math.round(d.mg) : '', t.note || '']);
    });
  });
  return {hijos, medidas, tomas};
}

async function exportExcel() {
  if (!Store.kids.length) { toast('No hay datos que exportar'); return; }
  toast('Preparando el archivo…');
  const {hijos, medidas, tomas} = buildSheets();
  const name = 'dosis-crecimiento-' + todayISO() + '.xlsx';
  let data, filename = name;
  try {
    const XLSX = await loadXLSX();
    const wb = XLSX.utils.book_new();
    const add = (aoa, title, widths) => {
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = widths.map(w => ({wch: w}));
      XLSX.utils.book_append_sheet(wb, ws, title);
    };
    add(medidas, 'Medidas', [14, 12, 13, 10, 10, 11, 8, 14, 14, 13]);
    add(tomas, 'Tomas', [14, 14, 20, 12, 8, 11, 11, 24]);
    add(hijos, 'Hijos', [16, 8, 20, 16]);
    data = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
  } catch (e) {
    const csv = [['HIJOS'], ...hijos, [], ['MEDIDAS'], ...medidas, [], ['TOMAS'], ...tomas]
      .map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    data = '\ufeff' + csv;
    filename = name.replace('.xlsx', '.csv');
  }
  try {
    const blob = new Blob([data], {type: filename.endsWith('.csv') ? 'text/csv' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast('Aquí no se puede descargar; ábrela como app publicada'); }
}

/* ============================ arranque ============================ */
Store.init();
setInterval(() => { if (UI.tab === 'home') renderHome(); }, 30000);
